name: Publish Architecture Diagrams

# Trigger on changes to architecture files
on:
  push:
    branches:
      - main
      - master
      - feature/purge-optimization-10-21  # Current branch for testing
    paths:
      - 'docs/architecture/**'
  workflow_dispatch:  # Allow manual trigger

# Permissions needed for publishing
permissions:
  contents: read

jobs:
  validate:
    name: Validate Architecture Diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Structurizr CLI
        run: |
          npm install -g @structurizr/cli
          structurizr-cli version

      - name: Validate workspace.dsl
        run: |
          cd docs/architecture
          echo "Validating workspace.dsl syntax..."
          structurizr-cli validate workspace.dsl
          echo "✅ Validation successful!"

      - name: Generate diagram preview (SVG)
        run: |
          cd docs/architecture
          echo "Generating SVG diagrams for preview..."
          structurizr-cli export workspace.dsl -format plantuml -output ./preview
          ls -la ./preview || echo "Preview generation complete"

      - name: Architecture validation summary
        run: |
          echo "### ✅ Architecture Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File**: \`docs/architecture/workspace.dsl\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Valid C4 model structure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps**:" >> $GITHUB_STEP_SUMMARY
          echo "1. View diagrams locally: \`docker-compose -f docker-compose.structurizr.yml up\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Open browser: http://localhost:8081" >> $GITHUB_STEP_SUMMARY
          echo "3. Navigate through System Context → Containers → Components" >> $GITHUB_STEP_SUMMARY

