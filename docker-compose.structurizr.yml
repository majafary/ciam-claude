version: "3.8"

services:
  structurizr:
    image: structurizr/lite:latest
    container_name: ciam-structurizr
    ports:
      - "8081:8080"
    volumes:
      - ./docs/architecture:/usr/local/structurizr
    environment:
      - STRUCTURIZR_WORKSPACE_FILENAME=ciam
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ciam-network

networks:
  ciam-network:
    name: ciam-network
    external: false
    driver: bridge
