# Structurizr Lite Configuration

# Auto-save interval in milliseconds (how often to check for DSL changes and regenerate JSON)
# Default: 5000ms (5 seconds)
structurizr.autoSaveInterval=5000

# Auto-refresh interval in milliseconds (how often the browser automatically reloads)
# Default: 0 (disabled)
# Setting to 2000ms (2 seconds) for automatic browser refresh
structurizr.autoRefreshInterval=2000
